<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑧ 교육·법정의무교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/base.css">
<style>
.cellbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;
  font-size:.74rem;font-weight:700;padding:3px 0;width:84px;color:#9aa7ae;
}
.cellbtn.done{background:#e4f1ea;border-color:#cfe6da;color:var(--pos)}
.cellbtn:hover{border-color:var(--accent)}
.duelist .mrow input[type=date]{
  padding:4px 7px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.8rem;margin-left:auto;
}
.matrix thead th{min-width:92px}
.matrix thead th:first-child,.matrix tbody td:first-child{position:sticky;left:0;background:var(--surface2);z-index:2}
.matrix tbody td:first-child{background:var(--surface)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="mainwrap">
    <header class="top" id="topbar"></header>
    <main>
      <div class="banner" id="srcBanner"></div>

      <div class="kpis" id="kpiGrid"></div>

      <div class="grid">
        <div class="panel w6">
          <div class="panel-h"><h2>법정교육 과정별 이수율</h2><span class="sub">재직자 기준 · %</span></div>
          <div class="chartbox"><canvas id="chCourse"></canvas></div>
        </div>
        <div class="panel w6">
          <div class="panel-h"><h2>팀별 법정 이수율</h2><span class="sub">전 과정 평균 · %</span></div>
          <div class="chartbox"><canvas id="chTeam"></canvas></div>
        </div>
        <div class="panel w8">
          <div class="panel-h"><h2>월별 직무교육 시간</h2><span class="sub">최근 12개월 · 로그 기준</span></div>
          <div class="chartbox"><canvas id="chHours"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>법정교육 이수 기한</h2></div>
          <div class="minilist duelist" style="margin-top:0;border-top:0;padding-top:0" id="dueList"></div>
          <div style="margin-top:10px"><button class="btn sm primary" id="btnDueSave">기한 저장</button></div>
          <p style="font-size:.78rem;color:var(--ink3);margin-top:12px;line-height:1.6">미이수 시 과태료 대상 과정은 기한 60일 전부터 임박 경고로 집계됩니다.</p>
        </div>
      </div>

      <!-- 법정교육 매트릭스 -->
      <div class="panel full" style="margin-top:18px">
        <div class="panel-h"><h2>법정의무교육 이수 매트릭스</h2><span class="sub">셀 클릭으로 이수 처리/취소 · 재직자 자동 생성</span></div>
        <div style="overflow:auto;max-height:60vh">
          <table class="tbl matrix">
            <thead id="mxHead"></thead>
            <tbody id="mxBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 직무교육 로그 -->
      <div class="panel full" style="margin-top:18px">
        <div class="panel-h"><h2>직무교육 이수 로그</h2>
          <span class="end"><button class="btn sm" id="btnAddLog">직무교육 등록</button></span>
        </div>
        <div style="overflow:auto;max-height:46vh">
          <table class="tbl">
            <thead><tr><th>성명</th><th>소속</th><th>교육 과정</th><th class="r">시간</th><th>이수일</th><th>관리</th></tr></thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
        <div class="empty" id="logEmpty" hidden>직무교육 이수 기록이 없습니다.</div>
      </div>
    </main>
  </div>
</div>

<!-- 직무교육 모달 -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">직무교육 등록</h2>
    <form id="form">
      <div class="formgrid">
        <div class="field"><label>성명 <em>*</em></label><input id="iName" list="nameList" required></div>
        <div class="field"><label>소속</label><input id="iTeam"></div>
        <div class="field span2"><label>교육 과정 <em>*</em></label><input id="iCourse" required placeholder="예) 수소안전 실무, PLC 제어 심화"></div>
        <div class="field"><label>교육 시간 (h)</label><input type="number" id="iHours" min="0" step="0.5" value="8"></div>
        <div class="field"><label>이수일</label><input type="date" id="iDate"></div>
      </div>
      <div class="modalfoot">
        <button type="button" class="btn" id="btnClose">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>
<datalist id="nameList"></datalist>

<script src="assets/core.js"></script>
<script>
/* ============================================================
 * training — ⑧ 교육·법정의무교육 대시보드
 * 명부 소스: ① 인력현황 자동 연동(없으면 내장 샘플)
 * 저장: localStorage kfs_training_v1
 * 모델: courses[법정 5종 {id,name,due,hours}]
 *       done{ "<사번|성명>|<courseId>": 이수일 }  ·  logs[직무교육]
 * ========================================================== */
const { $, esc, uid, fmt, d, C, ui, chart, xl } = KFS;
const DB = KFS.store('kfs_training_v1');
const LEGAL = [
  { id:'c1', name:'산업안전보건교육', hours:12 },
  { id:'c2', name:'직장 내 성희롱 예방교육', hours:1 },
  { id:'c3', name:'개인정보보호 교육', hours:1 },
  { id:'c4', name:'직장 내 장애인 인식개선 교육', hours:1 },
  { id:'c5', name:'퇴직연금 교육', hours:1 }
];
let state = DB.load({
  courses: LEGAL.map(c => Object.assign({ due: new Date().getFullYear() + '-12-31' }, c)),
  done: {}, logs: [], sample: false
});
let editingId = null;

/* ───── 명부 ───── */
const SAMPLE = [
  ['홍성일','대표이사','2020-03-02'],['김영배','임원','2020-05-11'],['박정우','임원','2021-01-04'],
  ['이승권','임원','2021-07-01'],['최동혁','본부장','2021-09-01'],['신우철','본부장','2022-02-14'],
  ['윤상민','영업1팀','2022-05-02'],['한가영','영업1팀','2024-03-04'],['조현성','영업2팀','2022-08-16'],
  ['임다혜','영업2팀','2025-02-03'],['서준호','경영지원팀','2023-01-02'],['문지현','경영지원팀','2023-06-12'],
  ['백승아','경영지원팀','2025-07-01'],['오민재','구매팀','2021-11-01'],['황보라','구매팀','2024-09-02'],
  ['전태규','생산팀','2020-09-01'],['남기원','생산팀','2021-04-05'],['유성재','생산팀','2022-10-04'],
  ['고은비','생산팀','2024-01-08'],['차민호','생산팀','2026-09-01'],['노현우','스택개발팀','2020-06-01'],
  ['양지훈','스택개발팀','2021-03-02'],['구세라','스택개발팀','2023-04-03'],['두경민','스택개발팀','2025-05-07'],
  ['하정민','시스템개발팀','2021-08-02'],['손미경','시스템개발팀','2022-03-07'],['변성호','시스템개발팀','2023-09-04'],
  ['심재욱','시스템개발팀','2026-08-03'],['공유진','제어개발팀','2022-01-10'],['설하윤','제어개발팀','2023-11-06'],
  ['반도윤','제어개발팀','2025-03-03']
].map(r => ({ name:r[0], team:r[1], joinDate:r[2], leaveDate:'' }));
const TEAM_ORDER = ['대표이사','임원','본부장','영업1팀','영업2팀','경영지원팀','구매팀','생산팀','스택개발팀','시스템개발팀','제어개발팀'];
const ext = KFS.ext.roster();
const EMP = (ext.ok ? ext.employees : SAMPLE)
  .filter(e => ext.isActiveAt(e, d.today()))
  .sort((a,b) => {
    const ti = t => { const i = TEAM_ORDER.indexOf(t); return i === -1 ? 999 : i; };
    return ti(a.team) - ti(b.team) || (a.joinDate||'').localeCompare(b.joinDate||'');
  });
const key = (e) => e.empNo || e.name;

/* ───── 샘플 이수 데이터 (결정적) ───── */
function seedDone(){
  const dates = ['2026-03-12','2026-04-25','2026-05-30','2026-06-18','2026-07-22','2026-09-05'];
  EMP.forEach((e, i) => {
    state.courses.forEach((c, j) => {
      const r = (i * 7 + j * 13) % 10;                 /* 의사난수 */
      const limit = [8, 9, 8, 7, 6][j];                /* 과정별 이수율 차등 */
      if (r < limit) state.done[key(e) + '|' + c.id] = dates[(i + j) % dates.length];
    });
  });
  const L = [
    ['유성재','생산팀','수소설비 안전관리 실무',16,'2026-04-10'],['남기원','생산팀','품질관리 ISO 내부심사원',14,'2026-05-22'],
    ['구세라','스택개발팀','연료전지 스택 해석 과정',21,'2026-06-12'],['하정민','시스템개발팀','BOP 제어 시스템 설계',18,'2026-07-03'],
    ['문지현','경영지원팀','급여·4대보험 실무',7,'2026-08-21'],['황보라','구매팀','구매계약·하도급법 실무',7,'2026-09-04'],
    ['반도윤','제어개발팀','PLC 제어 심화',16,'2026-09-19'],['한가영','영업1팀','B2B 제안영업 과정',8,'2026-10-02']
  ];
  state.logs = L.map(r => ({ id: uid(), name:r[0], team:r[1], course:r[2], hours:r[3], date:r[4] }));
  state.sample = true;
}

/* ───── 집계 ───── */
function metrics(){
  const totalCells = EMP.length * state.courses.length;
  let doneCells = 0;
  const byCourse = state.courses.map(c => {
    const n = EMP.filter(e => state.done[key(e) + '|' + c.id]).length;
    doneCells += n;
    return { c, n, rate: EMP.length ? Math.round(n / EMP.length * 100) : 0 };
  });
  const incomplete = EMP.filter(e => state.courses.some(c => !state.done[key(e) + '|' + c.id]));
  const urgent = byCourse.filter(x => x.rate < 100 && (() => { const dd = d.dday(x.c.due); return dd !== null && dd <= 60; })());
  const year = d.today().getFullYear();
  const yearLogs = state.logs.filter(l => (l.date || '').startsWith(year + '-'));
  const yearHours = yearLogs.reduce((s,l)=>s+(+l.hours||0),0);
  return { totalCells, doneCells,
    rate: totalCells ? Math.round(doneCells / totalCells * 100) : 0,
    incomplete, urgent, byCourse, year, yearLogs, yearHours,
    perHead: EMP.length ? (yearHours / EMP.length).toFixed(1) : '0' };
}

/* ───── 렌더 ───── */
function renderKpis(m){
  ui.kpis('#kpiGrid', [
    { l:'법정교육 이수율', v:m.rate, u:'%', cap:'이수 ' + m.doneCells + ' / ' + m.totalCells + '건 (재직 ' + EMP.length + '명 × ' + state.courses.length + '과정)' },
    { l:'미이수 인원', v:m.incomplete.length, u:'명', cap:'1개 과정 이상 미이수' },
    { l:'기한 임박 과정', v:m.urgent.length, u:'건', cap:'D-60 이내 · 미완료' },
    { l:'인당 직무교육', v:m.perHead, u:'h', cap:m.year + '년 · 총 ' + fmt(m.yearHours) + '시간' },
    { l:'직무교육 이수', v:m.yearLogs.length, u:'건', cap:m.year + '년 누적' }
  ]);
}
function renderCharts(m){
  if (!chart.ok) return;
  chart.mk('chCourse', {
    type:'bar',
    data:{ labels:m.byCourse.map(x=>x.c.name.replace(' 교육','').replace('교육','')), datasets:[{ data:m.byCourse.map(x=>x.rate),
      backgroundColor:C.BRAND, borderRadius:{ topRight:3, bottomRight:3 }, barPercentage:.58 }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:34 } },
      plugins:{ legend:{ display:false }, datalabels: chart.dl.pct,
        tooltip:{ callbacks:{ label(ctx){ const x = m.byCourse[ctx.dataIndex]; return ' ' + x.n + '/' + EMP.length + '명 · ' + ctx.parsed.x + '%'; } } } },
      scales:{ x:{ max:112, display:false }, y:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } } }
    }
  });
  const teams = [...new Set(EMP.map(e=>e.team))];
  const tRates = teams.map(t => {
    const es = EMP.filter(e => e.team === t);
    const tot = es.length * state.courses.length;
    const dn = es.reduce((s,e)=>s + state.courses.filter(c=>state.done[key(e)+'|'+c.id]).length, 0);
    return tot ? Math.round(dn / tot * 100) : 0;
  });
  chart.mk('chTeam', {
    type:'bar',
    data:{ labels:teams, datasets:[{ data:tRates, backgroundColor:C.SLATE,
      borderRadius:{ topRight:3, bottomRight:3 }, barPercentage:.58 }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:34 } },
      plugins:{ legend:{ display:false }, datalabels: chart.dl.pct,
        tooltip:{ callbacks:{ label(ctx){ return ' ' + ctx.parsed.x + '%'; } } } },
      scales:{ x:{ max:112, display:false }, y:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } } }
    }
  });
  const months = d.lastMonths(12);
  const hv = months.map(mo => state.logs.filter(l => (l.date||'').startsWith(mo.key)).reduce((s,l)=>s+(+l.hours||0),0));
  chart.mk('chHours', {
    type:'bar',
    data:{ labels:months.map(x=>x.label), datasets:[{ data:hv, backgroundColor:C.BRAND,
      borderRadius:{ topLeft:3, topRight:3 }, barPercentage:.55 }] },
    options:{
      responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:16 } },
      plugins:{ legend:{ display:false }, datalabels: chart.dl.top,
        tooltip:{ callbacks:{ label(ctx){ return ' ' + ctx.parsed.y + '시간'; } } } },
      scales:{ y:{ display:false, beginAtZero:true, suggestedMax:Math.max(4,...hv)+4 },
               x:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } } }
    }
  });
}
function renderDue(){
  $('#dueList').innerHTML = state.courses.map(c => {
    const dd = d.dday(c.due);
    const warn = dd !== null && dd <= 60 ? ' <span class="chip y">D-' + Math.max(0, dd) + '</span>' : '';
    return '<div class="mrow"><b style="font-size:.82rem">' + esc(c.name) + '</b>' + warn +
      '<input type="date" data-due="' + c.id + '" value="' + esc(c.due) + '"></div>';
  }).join('');
}
function renderMatrix(){
  $('#mxHead').innerHTML = '<tr><th>성명</th><th>소속</th>' +
    state.courses.map(c => '<th>' + esc(c.name.replace(' 교육','').replace('교육','')) + '<br><span style="font-weight:500;color:var(--ink3)">' + c.hours + 'h · ~' + esc((c.due||'').slice(5)) + '</span></th>').join('') +
    '<th class="r">이수율</th></tr>';
  $('#mxBody').innerHTML = EMP.map(e => {
    const cells = state.courses.map(c => {
      const dt = state.done[key(e) + '|' + c.id];
      return '<td><button class="cellbtn' + (dt ? ' done' : '') + '" data-emp="' + esc(key(e)) + '" data-course="' + c.id + '">' +
        (dt ? '✓ ' + dt.slice(2).replace(/-/g,'.') : '미이수') + '</button></td>';
    }).join('');
    const dn = state.courses.filter(c => state.done[key(e) + '|' + c.id]).length;
    const rate = Math.round(dn / state.courses.length * 100);
    return '<tr><td><b>' + esc(e.name) + '</b></td><td>' + esc(e.team || '') + '</td>' + cells +
      '<td class="r"' + (rate === 100 ? ' style="color:var(--pos);font-weight:700"' : rate < 60 ? ' style="color:var(--neg);font-weight:700"' : '') + '>' + rate + '%</td></tr>';
  }).join('');
}
function renderLogs(){
  const logs = state.logs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  $('#logEmpty').hidden = logs.length > 0;
  $('#logBody').innerHTML = logs.map(l =>
    '<tr><td><b>' + esc(l.name) + '</b></td><td>' + esc(l.team || '') + '</td><td style="white-space:normal">' + esc(l.course) + '</td>' +
    '<td class="r">' + (+l.hours||0) + 'h</td><td>' + esc(l.date || '') + '</td>' +
    '<td><button class="rowbtn" data-act="edit" data-id="' + l.id + '">수정</button> <button class="rowbtn danger" data-act="del" data-id="' + l.id + '">삭제</button></td></tr>'
  ).join('');
}
function renderAll(){
  const m = metrics();
  renderKpis(m); renderCharts(m); renderDue(); renderMatrix(); renderLogs();
}

/* ───── 셸 + 이벤트 ───── */
KFS.shell({
  active:'training', title:'교육·법정의무교육', sub:'법정 5종 이수 매트릭스 · 직무교육 시간 관리',
  actions:[{ id:'btnAddTop', label:'직무교육 등록', primary:true }],
  sideActions:[{ id:'btnExportMx', label:'이수현황 다운로드' }, { id:'btnExportLog', label:'직무교육 로그 다운로드' }]
});
$('#srcBanner').innerHTML = ext.ok
  ? '<span>명부 소스: <b>① 인력현황 대시보드 연동</b> — 재직자 ' + EMP.length + '명의 이수 매트릭스가 자동 생성됩니다.</span>'
  : '<span>인력현황 데이터가 없어 <b>내장 샘플 명부</b>(' + EMP.length + '명)로 표시 중입니다. ① 인력현황을 같은 도메인에 배포하면 자동 연동됩니다.</span>';
$('#nameList').innerHTML = EMP.map(e=>'<option value="'+esc(e.name)+'">').join('');

/* 매트릭스 토글 */
$('#mxBody').addEventListener('click', ev => {
  const btn = ev.target.closest('.cellbtn'); if (!btn) return;
  const k = btn.dataset.emp + '|' + btn.dataset.course;
  if (state.done[k]) {
    if (!confirm('이수 처리를 취소할까요?')) return;
    delete state.done[k];
  } else {
    state.done[k] = d.iso(d.today());
  }
  state.sample = false; DB.save(state); renderAll();
});
/* 기한 저장 */
$('#btnDueSave').addEventListener('click', () => {
  state.courses.forEach(c => {
    const el = document.querySelector('[data-due="' + c.id + '"]');
    if (el && el.value) c.due = el.value;
  });
  DB.save(state); renderAll();
});
/* 직무교육 CRUD */
const modal = ui.modal('#overlay');
function openLog(l){
  editingId = l ? l.id : null;
  $('#modalTitle').textContent = l ? '직무교육 수정' : '직무교육 등록';
  $('#iName').value = l ? l.name : '';
  $('#iTeam').value = l ? (l.team || '') : '';
  $('#iCourse').value = l ? l.course : '';
  $('#iHours').value = l ? l.hours : 8;
  $('#iDate').value = l ? (l.date || '') : d.iso(d.today());
  modal.open(); $('#iName').focus();
}
$('#iName').addEventListener('change', () => {
  const e = EMP.find(x => x.name === $('#iName').value);
  if (e && !$('#iTeam').value) $('#iTeam').value = e.team || '';
});
$('#btnAddTop').addEventListener('click', () => openLog(null));
$('#btnAddLog').addEventListener('click', () => openLog(null));
$('#btnClose').addEventListener('click', modal.close);
$('#form').addEventListener('submit', ev => {
  ev.preventDefault();
  const rec = { name:$('#iName').value.trim(), team:$('#iTeam').value.trim(),
    course:$('#iCourse').value.trim(), hours:+$('#iHours').value||0, date:$('#iDate').value };
  if (!rec.name || !rec.course) return;
  if (editingId) Object.assign(state.logs.find(l=>l.id===editingId), rec);
  else { state.logs.push(Object.assign({ id: uid() }, rec)); state.sample = false; }
  DB.save(state); modal.close(); renderAll();
});
$('#logBody').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-act]'); if (!btn) return;
  const l = state.logs.find(x=>x.id===btn.dataset.id); if (!l) return;
  if (btn.dataset.act === 'edit') openLog(l);
  if (btn.dataset.act === 'del' && confirm('이수 기록을 삭제할까요?')) {
    state.logs = state.logs.filter(x=>x.id!==l.id); DB.save(state); renderAll();
  }
});

/* ───── 엑셀 다운로드 ───── */
$('#btnExportMx').addEventListener('click', () => {
  const rows = EMP.map(e => {
    const row = { 성명:e.name, 소속:e.team || '' };
    state.courses.forEach(c => { row[c.name] = state.done[key(e)+'|'+c.id] || '미이수'; });
    const dn = state.courses.filter(c=>state.done[key(e)+'|'+c.id]).length;
    row['이수율'] = Math.round(dn / state.courses.length * 100) + '%';
    return row;
  });
  xl.down(rows, { headers:['성명','소속'].concat(state.courses.map(c=>c.name)).concat(['이수율']),
    widths:[9,12,16,20,16,24,14,8], sheet:'법정교육', file:'법정교육이수현황_' + d.iso(d.today()).replace(/-/g,'') + '.xlsx' });
});
$('#btnExportLog').addEventListener('click', () => {
  if (!state.logs.length) { alert('내보낼 기록이 없습니다.'); return; }
  xl.down(state.logs.map(l => ({ 성명:l.name, 소속:l.team, 교육과정:l.course, 시간:l.hours, 이수일:l.date })),
    { headers:['성명','소속','교육과정','시간','이수일'], widths:[9,12,28,7,11], sheet:'직무교육', file:'직무교육로그_' + d.iso(d.today()).replace(/-/g,'') + '.xlsx' });
});

/* ───── 초기화 ───── */
if (!Object.keys(state.done).length && !state.logs.length && !localStorage.getItem('kfs_training_v1')) { seedDone(); DB.save(state); }
if (state.sample) {
  const b = document.createElement('div');
  /* 샘플 안내는 소스 배너에 통합 */
  $('#srcBanner').innerHTML += ' <b>현재 이수 데이터는 샘플입니다.</b>';
}
renderAll();
</script>
</body>
</html>
