<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑨ 노무 컴플라이언스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/base.css">
<style>
.dd{font-size:.76rem;font-weight:800;padding:1.5px 8px;border-radius:99px;white-space:nowrap}
.dd.over{background:#f7e9ea;color:var(--neg)}
.dd.soon{background:#f8f0dc;color:var(--warn-ink)}
.dd.ok{background:#eef2f4;color:var(--ink2)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="mainwrap">
    <header class="top" id="topbar"></header>
    <main>
      <div class="banner" id="sampleBanner" hidden>
        <span>지금 보이는 항목은 <b>샘플</b>입니다. 근로감독 지적사항·자체점검 결과·분쟁 건을 이슈로 등록해 기한과 조치를 추적하세요.</span>
        <button class="btn" id="btnClearSample">샘플 비우기</button>
      </div>

      <div class="kpis" id="kpiGrid"></div>

      <div class="grid">
        <div class="panel w8">
          <div class="panel-h"><h2>월별 발생 · 완결</h2><span class="sub">최근 12개월</span></div>
          <div class="chartbox"><canvas id="chFlow"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>심각도 분포</h2><span class="sub">미완료 기준</span></div>
          <div class="chartbox"><canvas id="chSev"></canvas></div>
          <div class="nodata" id="noSev" hidden>미완료 이슈가 없습니다.</div>
        </div>
        <div class="panel w6">
          <div class="panel-h"><h2>분류별 미완료</h2></div>
          <div class="chartbox"><canvas id="chCat"></canvas></div>
          <div class="nodata" id="noCat" hidden>미완료 이슈가 없습니다.</div>
        </div>
        <div class="panel w6">
          <div class="panel-h"><h2>조치 기한 임박 순</h2><span class="sub">미완료 이슈 · 기한 빠른 순</span></div>
          <div class="minilist" style="margin-top:0;border-top:0;padding-top:0" id="dueSoonList"></div>
        </div>
      </div>

      <!-- 이슈 대장 -->
      <div class="toolrow" style="margin-top:18px">
        <select id="fCat"></select>
        <select id="fSev"><option value="">심각도 전체</option><option>상</option><option>중</option><option>하</option></select>
        <select id="fStatus"><option value="">상태 전체</option><option>대응중</option><option>모니터링</option><option>완료</option></select>
        <span class="count" id="issueCount"></span>
      </div>
      <div class="tablewrap">
        <table class="tbl">
          <thead><tr>
            <th>이슈</th><th>분류</th><th>출처</th><th>심각도</th><th>담당</th><th>기한</th><th>상태</th><th>관리</th>
          </tr></thead>
          <tbody id="issueBody"></tbody>
        </table>
        <div class="empty" id="issueEmpty" hidden>등록된 이슈가 없습니다. <b>이슈 등록</b>으로 시작하세요.</div>
      </div>

      <!-- 정기 점검 -->
      <div class="panel full" style="margin-top:18px">
        <div class="panel-h"><h2>정기 점검 체크리스트</h2><span class="sub">주기 경과 시 자동 임박 표시</span>
          <span class="end"><button class="btn sm" id="btnAddCheck">점검 항목 추가</button></span>
        </div>
        <div style="overflow:auto">
          <table class="tbl">
            <thead><tr><th>점검 항목</th><th>주기</th><th>최근 점검</th><th>다음 예정</th><th>관리</th></tr></thead>
            <tbody id="checkBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 이슈 모달 -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">이슈 등록</h2>
    <form id="form">
      <div class="formgrid">
        <div class="field span2"><label>이슈 제목 <em>*</em></label><input id="iTitle" required></div>
        <div class="field"><label>분류</label><select id="iCat"></select></div>
        <div class="field"><label>출처</label><select id="iOrigin"><option>근로감독</option><option>자체점검</option><option>노동위원회</option><option>법령 개정</option><option>기타</option></select></div>
        <div class="field"><label>심각도</label><select id="iSev"><option>상</option><option selected>중</option><option>하</option></select></div>
        <div class="field"><label>상태</label><select id="iStatus"><option>대응중</option><option>모니터링</option><option>완료</option></select></div>
        <div class="field"><label>발생일</label><input type="date" id="iOpened"></div>
        <div class="field"><label>조치 기한</label><input type="date" id="iDue"></div>
        <div class="field"><label>담당</label><input id="iOwner" value="경영지원팀"></div>
        <div class="field span2"><label>조치 내용·계획</label><textarea id="iAction"></textarea></div>
      </div>
      <div class="modalfoot">
        <button type="button" class="btn" id="btnClose">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 점검 항목 모달 -->
<div class="overlay" id="chkOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="chkTitle">점검 항목 추가</h2>
    <form id="chkForm">
      <div class="formgrid">
        <div class="field span2"><label>점검 항목 <em>*</em></label><input id="cItem" required></div>
        <div class="field"><label>주기</label><select id="cCycle"><option>월</option><option>분기</option><option>반기</option><option>연</option></select></div>
        <div class="field"><label>최근 점검일</label><input type="date" id="cLast"></div>
      </div>
      <div class="modalfoot">
        <button type="button" class="btn" id="chkClose">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/core.js"></script>
<script>
/* ============================================================
 * compliance — ⑨ 노무 컴플라이언스 대시보드
 * 저장: localStorage kfs_compliance_v1
 * 모델: issues[{id,title,cat,origin,sev,status,opened,due,closed,owner,action}]
 *       checks[{id,item,cycle,last}] — 다음 예정일은 주기로 자동 계산
 * ========================================================== */
const { $, esc, uid, fmt, d, C, ui, chart, xl } = KFS;
const CATS = ['근로계약·규정','임금·수당','근로시간','산업안전','분쟁·구제','점검 지적','기타'];
const CYCLE_M = { '월':1, '분기':3, '반기':6, '연':12 };
const DB = KFS.store('kfs_compliance_v1');
let state = DB.load({ issues: [], checks: [], sample: false });
let editIssue = null, editCheck = null;

/* ───── 샘플 ───── */
function seed(){
  const I = [
    ['고정상여 통상임금 산입 기준 정비','임금·수당','근로감독','상','대응중','2026-08-20','2026-11-30','','임금체계 개편안 수립 중 — 11월 경영진 보고 예정'],
    ['수습 평가 절차·기록 문서화 보완','분쟁·구제','자체점검','상','대응중','2026-09-15','2026-11-14','','평가표 양식·면담 기록 체계 정비'],
    ['취업규칙 개정 신고','근로계약·규정','법령 개정','중','대응중','2026-09-01','2026-10-31','','개정안 내부 의견청취 완료, 신고 준비'],
    ['연장근로 한도 모니터링 체계 보완','근로시간','자체점검','중','모니터링','2026-07-10','2026-12-31','','근태 대시보드 주52시간 경보 운영 중'],
    ['근로자대표 서면합의 갱신','근로시간','자체점검','중','완료','2026-06-02','2026-08-31','2026-08-21','보상휴가·연장근로 합의서 갱신 완료'],
    ['안전보건교육 미이수자 조치','산업안전','점검 지적','하','완료','2026-05-12','2026-06-30','2026-06-25','미이수 3명 보충 교육 완료'],
    ['채용공고 필수 표기사항 점검','근로계약·규정','자체점검','하','모니터링','2026-04-08','2026-12-31','','분기별 공고 전수 점검']
  ];
  state.issues = I.map(r => ({ id: uid(), title:r[0], cat:r[1], origin:r[2], sev:r[3], status:r[4], opened:r[5], due:r[6], closed:r[7], action:r[8], owner:'경영지원팀' }));
  const K = [
    ['신규 입사자 근로계약서 작성·교부 점검','월','2026-10-02'],
    ['주 52시간 한도 모니터링','월','2026-10-06'],
    ['4대보험 취득·상실 신고 누락 점검','월','2026-09-30'],
    ['취업규칙·법정 게시물 비치 점검','분기','2026-08-18'],
    ['위험성평가 실시','반기','2026-06-20'],
    ['최저임금·통상임금 반영 점검','연','2026-01-15']
  ];
  state.checks = K.map(r => ({ id: uid(), item:r[0], cycle:r[1], last:r[2] }));
  state.sample = true;
}

/* ───── 집계 ───── */
const open = (i) => i.status !== '완료';
const nextCheck = (c) => {
  const last = d.toD(c.last); if (!last) return null;
  const n = new Date(last); n.setMonth(n.getMonth() + (CYCLE_M[c.cycle] || 1));
  return n;
};
function metrics(){
  const yr = d.today().getFullYear();
  const opens = state.issues.filter(open);
  const dueSoon = opens.filter(i => { const dd = d.dday(i.due); return dd !== null && dd <= 14; });
  const closedY = state.issues.filter(i => (i.closed || '').startsWith(yr + '-'));
  const chkSoon = state.checks.filter(c => { const n = nextCheck(c); return n && (n - d.today()) / 86400000 <= 7; });
  return { opens, dueSoon, closedY, chkSoon,
    high: opens.filter(i => i.sev === '상').length, yr };
}
function ddBadge(due, done){
  if (done) return '';
  const dd = d.dday(due);
  if (dd === null) return '<span class="dd ok">기한 없음</span>';
  if (dd < 0) return '<span class="dd over">D+' + Math.abs(dd) + ' 초과</span>';
  if (dd <= 14) return '<span class="dd soon">D-' + dd + '</span>';
  return '<span class="dd ok">D-' + dd + '</span>';
}

/* ───── 렌더 ───── */
function renderKpis(m){
  ui.kpis('#kpiGrid', [
    { l:'진행 중 이슈', v:m.opens.length, u:'건', cap:'대응중 ' + m.opens.filter(i=>i.status==='대응중').length + ' · 모니터링 ' + m.opens.filter(i=>i.status==='모니터링').length },
    { l:'고위험 미완료', v:m.high, u:'건', cap:'심각도 상' },
    { l:'기한 임박', v:m.dueSoon.length, u:'건', cap:'D-14 이내 (초과 포함)' },
    { l:'올해 완결', v:m.closedY.length, u:'건', cap:m.yr + '년 조치 완료' },
    { l:'정기점검 임박', v:m.chkSoon.length, u:'건', cap:'다음 예정 D-7 이내' }
  ]);
}
function renderCharts(m){
  if (!chart.ok) return;
  /* 월별 발생·완결 */
  const months = d.lastMonths(12);
  const openedV = months.map(mo => state.issues.filter(i => (i.opened || '').startsWith(mo.key)).length);
  const closedV = months.map(mo => state.issues.filter(i => (i.closed || '').startsWith(mo.key)).length);
  chart.mk('chFlow', {
    type:'bar',
    data:{ labels:months.map(x=>x.label), datasets:[
      { label:'발생', data:openedV, backgroundColor:C.CAT[1], borderRadius:{ topLeft:3, topRight:3 }, barPercentage:.42, categoryPercentage:.7 },
      { label:'완결', data:closedV, backgroundColor:C.CAT[2], borderRadius:{ topLeft:3, topRight:3 }, barPercentage:.42, categoryPercentage:.7 }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:14 } },
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:11, boxHeight:11, font:{ size:11.5 } } },
        datalabels: chart.dl.top,
        tooltip:{ callbacks:{ label(ctx){ return ' ' + ctx.dataset.label + ' ' + ctx.parsed.y + '건'; } } } },
      scales:{ y:{ display:false, beginAtZero:true, suggestedMax:Math.max(1,...openedV,...closedV)+1.5 },
               x:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } } }
    }
  });
  /* 분류별 미완료 */
  const cc = {};
  m.opens.forEach(i => { cc[i.cat] = (cc[i.cat] || 0) + 1; });
  const cKeys = CATS.filter(c => cc[c]);
  const hasC = cKeys.length > 0;
  $('#chCat').parentElement.hidden = !hasC; $('#noCat').hidden = hasC;
  if (hasC) chart.mk('chCat', {
    type:'bar',
    data:{ labels:cKeys, datasets:[{ data:cKeys.map(k=>cc[k]), backgroundColor:C.SLATE,
      borderRadius:{ topRight:3, bottomRight:3 }, barPercentage:.55 }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{ padding:{ right:24 } },
      plugins:{ legend:{ display:false }, datalabels: chart.dl.end,
        tooltip:{ callbacks:{ label(ctx){ return ' ' + ctx.parsed.x + '건'; } } } },
      scales:{ x:{ display:false, suggestedMax:Math.max(...cKeys.map(k=>cc[k]))+1 }, y:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } } }
    }
  });
  /* 심각도 — 순서형(하→상) 램프 */
  const sv = { '하':0, '중':0, '상':0 };
  m.opens.forEach(i => { sv[i.sev] = (sv[i.sev] || 0) + 1; });
  const sKeys = ['하','중','상'].filter(k => sv[k]);
  const hasS = sKeys.length > 0;
  $('#chSev').parentElement.hidden = !hasS; $('#noSev').hidden = hasS;
  if (hasS) chart.mk('chSev', {
    type:'doughnut',
    data:{ labels:sKeys.map(k=>'심각도 ' + k), datasets:[{ data:sKeys.map(k=>sv[k]),
      backgroundColor:sKeys.map(k => ({ '하':C.TEAL4[0], '중':C.TEAL4[1], '상':C.TEAL4[3] })[k]),
      borderWidth:2, borderColor:'#fff' }] },
    options: chart.doughnutOpts(m.opens.length, '미완료', '건')
  });
}
function renderIssues(){
  const fc = $('#fCat').value, fs = $('#fSev').value, fst = $('#fStatus').value;
  const sevOrder = { '상':0, '중':1, '하':2 };
  let list = state.issues.slice().sort((a,b)=>
    (open(a)?0:1)-(open(b)?0:1) || sevOrder[a.sev]-sevOrder[b.sev] || (a.due||'9999').localeCompare(b.due||'9999'));
  if (fc) list = list.filter(i => i.cat === fc);
  if (fs) list = list.filter(i => i.sev === fs);
  if (fst) list = list.filter(i => i.status === fst);
  $('#issueCount').textContent = '표시 ' + list.length + '건 / 전체 ' + state.issues.length + '건';
  $('#issueEmpty').hidden = state.issues.length > 0;
  const sevChip = s => s === '상' ? '<span class="chip r">상</span>' : s === '중' ? '<span class="chip y">중</span>' : '<span class="chip n">하</span>';
  const stChip = s => s === '대응중' ? '<span class="chip b">대응중</span>' : s === '모니터링' ? '<span class="chip y">모니터링</span>' : '<span class="chip g">완료</span>';
  $('#issueBody').innerHTML = list.map(i =>
    '<tr' + (open(i) ? '' : ' class="dim"') + '><td style="white-space:normal;min-width:240px"><b>' + esc(i.title) + '</b>' +
    (i.action ? '<div style="font-size:.78rem;color:var(--ink3);margin-top:2px">' + esc(i.action) + '</div>' : '') + '</td>' +
    '<td>' + esc(i.cat) + '</td><td>' + esc(i.origin) + '</td><td>' + sevChip(i.sev) + '</td><td>' + esc(i.owner || '') + '</td>' +
    '<td>' + esc(i.due || '') + ' ' + ddBadge(i.due, !open(i)) + '</td><td>' + stChip(i.status) + '</td>' +
    '<td><button class="rowbtn" data-act="edit" data-id="' + i.id + '">수정</button> <button class="rowbtn danger" data-act="del" data-id="' + i.id + '">삭제</button></td></tr>'
  ).join('');
}
function renderChecks(){
  $('#checkBody').innerHTML = state.checks.map(c => {
    const n = nextCheck(c);
    const dd = n ? Math.round((n - d.today()) / 86400000) : null;
    const badge = dd === null ? '<span class="dd ok">미실시</span>'
      : dd < 0 ? '<span class="dd over">D+' + Math.abs(dd) + ' 경과</span>'
      : dd <= 7 ? '<span class="dd soon">D-' + dd + '</span>' : '<span class="dd ok">D-' + dd + '</span>';
    return '<tr><td style="white-space:normal;min-width:240px"><b>' + esc(c.item) + '</b></td><td>' + esc(c.cycle) + '</td>' +
      '<td>' + esc(c.last || '—') + '</td><td>' + (n ? d.iso(n) + ' ' : '') + badge + '</td>' +
      '<td><button class="rowbtn" data-act="doneChk" data-id="' + c.id + '">점검 완료</button> ' +
      '<button class="rowbtn" data-act="editChk" data-id="' + c.id + '">수정</button> ' +
      '<button class="rowbtn danger" data-act="delChk" data-id="' + c.id + '">삭제</button></td></tr>';
  }).join('') || '<tr><td colspan="5" class="empty">점검 항목이 없습니다.</td></tr>';
}
function renderDueSoon(m){
  const list = m.opens.filter(i => i.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0, 6);
  $('#dueSoonList').innerHTML = list.length
    ? list.map(i =>
        '<div class="mrow"><b style="white-space:normal;font-size:.85rem">' + esc(i.title) + '</b>' +
        '<span class="dt">' + ddBadge(i.due, false) + '</span></div>'
      ).join('')
    : '<div class="mrow more">기한이 설정된 미완료 이슈가 없습니다.</div>';
}
function renderFilters(){
  const cur = $('#fCat').value;
  $('#fCat').innerHTML = '<option value="">분류 전체</option>' + CATS.map(c=>'<option>'+c+'</option>').join('');
  if (CATS.includes(cur)) $('#fCat').value = cur;
  $('#iCat').innerHTML = CATS.map(c=>'<option>'+c+'</option>').join('');
}
function renderAll(){
  const m = metrics();
  renderKpis(m); renderCharts(m); renderDueSoon(m); renderFilters(); renderIssues(); renderChecks();
  $('#sampleBanner').hidden = !state.sample;
}

/* ───── 셸 + 이벤트 ───── */
KFS.shell({
  active:'compliance', title:'노무 컴플라이언스', sub:'근로감독·자체점검 이슈 추적 · 정기 점검 관리',
  actions:[{ id:'btnAdd', label:'이슈 등록', primary:true }],
  sideActions:[{ id:'btnExport', label:'이슈 대장 다운로드' }]
});
const modal = ui.modal('#overlay');
const chkModal = ui.modal('#chkOverlay');
function openIssue(i){
  editIssue = i ? i.id : null;
  renderFilters();
  $('#modalTitle').textContent = i ? '이슈 수정' : '이슈 등록';
  $('#iTitle').value = i ? i.title : '';
  $('#iCat').value = i ? i.cat : CATS[0];
  $('#iOrigin').value = i ? i.origin : '자체점검';
  $('#iSev').value = i ? i.sev : '중';
  $('#iStatus').value = i ? i.status : '대응중';
  $('#iOpened').value = i ? (i.opened || '') : d.iso(d.today());
  $('#iDue').value = i ? (i.due || '') : '';
  $('#iOwner').value = i ? (i.owner || '') : '경영지원팀';
  $('#iAction').value = i ? (i.action || '') : '';
  modal.open(); $('#iTitle').focus();
}
$('#btnAdd').addEventListener('click', () => openIssue(null));
$('#btnClose').addEventListener('click', modal.close);
$('#form').addEventListener('submit', ev => {
  ev.preventDefault();
  const status = $('#iStatus').value;
  const prev = editIssue ? state.issues.find(x=>x.id===editIssue) : null;
  const rec = { title:$('#iTitle').value.trim(), cat:$('#iCat').value, origin:$('#iOrigin').value,
    sev:$('#iSev').value, status, opened:$('#iOpened').value, due:$('#iDue').value,
    owner:$('#iOwner').value.trim(), action:$('#iAction').value.trim(),
    closed: status === '완료' ? ((prev && prev.closed) || d.iso(d.today())) : '' };
  if (!rec.title) return;
  if (editIssue) Object.assign(prev, rec);
  else { state.issues.push(Object.assign({ id: uid() }, rec)); state.sample = false; }
  DB.save(state); modal.close(); renderAll();
});
$('#issueBody').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-act]'); if (!btn) return;
  const i = state.issues.find(x=>x.id===btn.dataset.id); if (!i) return;
  if (btn.dataset.act === 'edit') openIssue(i);
  if (btn.dataset.act === 'del' && confirm('"' + i.title + '" 이슈를 삭제할까요?')) {
    state.issues = state.issues.filter(x=>x.id!==i.id); DB.save(state); renderAll();
  }
});
/* 점검 체크리스트 */
function openCheck(c){
  editCheck = c ? c.id : null;
  $('#chkTitle').textContent = c ? '점검 항목 수정' : '점검 항목 추가';
  $('#cItem').value = c ? c.item : '';
  $('#cCycle').value = c ? c.cycle : '월';
  $('#cLast').value = c ? (c.last || '') : '';
  chkModal.open(); $('#cItem').focus();
}
$('#btnAddCheck').addEventListener('click', () => openCheck(null));
$('#chkClose').addEventListener('click', chkModal.close);
$('#chkForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const rec = { item:$('#cItem').value.trim(), cycle:$('#cCycle').value, last:$('#cLast').value };
  if (!rec.item) return;
  if (editCheck) Object.assign(state.checks.find(x=>x.id===editCheck), rec);
  else { state.checks.push(Object.assign({ id: uid() }, rec)); state.sample = false; }
  DB.save(state); chkModal.close(); renderAll();
});
$('#checkBody').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-act]'); if (!btn) return;
  const c = state.checks.find(x=>x.id===btn.dataset.id); if (!c) return;
  if (btn.dataset.act === 'doneChk') { c.last = d.iso(d.today()); DB.save(state); renderAll(); }
  if (btn.dataset.act === 'editChk') openCheck(c);
  if (btn.dataset.act === 'delChk' && confirm('점검 항목을 삭제할까요?')) {
    state.checks = state.checks.filter(x=>x.id!==c.id); DB.save(state); renderAll();
  }
});
['fCat','fSev','fStatus'].forEach(id => $('#'+id).addEventListener('input', renderIssues));
$('#btnClearSample').addEventListener('click', () => {
  if (!confirm('샘플 데이터를 모두 비울까요?')) return;
  state.issues = []; state.checks = []; state.sample = false; DB.save(state); renderAll();
});
$('#btnExport').addEventListener('click', () => {
  if (!state.issues.length) { alert('내보낼 이슈가 없습니다.'); return; }
  xl.down(state.issues.map(i => ({ 이슈:i.title, 분류:i.cat, 출처:i.origin, 심각도:i.sev, 상태:i.status,
    발생일:i.opened, 기한:i.due, 완결일:i.closed, 담당:i.owner, 조치내용:i.action })),
    { headers:['이슈','분류','출처','심각도','상태','발생일','기한','완결일','담당','조치내용'],
      widths:[32,12,10,7,8,11,11,11,10,36], sheet:'컴플라이언스', file:'노무이슈대장_' + d.iso(d.today()).replace(/-/g,'') + '.xlsx' });
});

/* ───── 초기화 ───── */
if (!state.issues.length && !state.checks.length && !localStorage.getItem('kfs_compliance_v1')) { seed(); DB.save(state); }
renderAll();
</script>
</body>
</html>
